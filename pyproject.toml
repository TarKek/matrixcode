[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matrixcode"
version = "0.2.0"
description = "local ai coding assistant: llama-server + textual tui + sandboxed tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "matrixcode" }]
dependencies = [
    "textual>=0.60",
    "httpx>=0.27",
]

[project.optional-dependencies]
images = ["matplotlib>=3.8", "Pillow>=10.0"]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
matrixcode = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = [
    "core", "core.childsandbox",
    "agent", "llm", "execution",
    "ui", "tools", "skills", "commands",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",
    "SIM105",
    "SIM108",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["core", "agent", "llm", "execution", "ui", "tools", "skills", "commands"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = false
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
files = ["core", "agent", "llm", "execution", "tools", "skills", "commands"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"